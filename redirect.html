<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        window.onload = function() {
            // URLパラメータ ?cmd=xxx を取得
            const params = new URLSearchParams(window.location.search);
            const cmd = params.get('cmd');
            const setup = params.get('setup');

            if (cmd && !setup) {
                // カスタムプロトコルへリダイレクト
                window.location.href = 'gtask://' + cmd;

                // 処理後にタブを閉じるメッセージ（ブラウザの制限で自動で閉じない場合があるため）
                document.body.innerHTML = 'Command sent. Please close this tab.';

                // 可能であればウィンドウを閉じる
                setTimeout(function(){ window.close(); }, 100);
            } else {
                const target = 'gtask://' + (cmd || 'noop');
                window.location.href = target;
                document.body.innerHTML = '<p>初回許可モード（このタブは自動で閉じません）。</p><p>上部のポップアップで「常に許可」にチェックを入れて開いてください。<br>表示されない場合は <a id="allow-link" href="' + target + '">こちらをクリック</a> してください。</p>';
            }
        };
    </script>
</head>
<body>
    <p>Launching local script...</p>
</body>
</html>
